# Weiterleitung an den API-Container (eingebunden in die /api-Locations)
proxy_pass http://api:3000;
proxy_http_version 1.1;
# Host mit Port weitergeben — die API vergleicht ihn mit dem Origin-Header (Schutz vor CSRF)
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# Ersetzen statt anhängen: die API sieht genau eine, von Nginx ermittelte Client-IP
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
