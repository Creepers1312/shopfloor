# Liefert die Oberfläche aus und reicht /api an den API-Container weiter.
# Die Datenbank ist von hier aus nicht erreichbar (eigenes, internes Netz).
# Steht ein Reverse Proxy (z. B. Nginx Proxy Manager) davor, dessen Protokoll-Angabe übernehmen
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # Port 8080 statt 80: der Container läuft ohne Root-Rechte.
    # Nur IPv4: Docker leitet den veröffentlichten Port per IPv4 in den Container, und ein
    # fest eingetragenes "listen [::]" ließe Nginx auf Hosts ohne IPv6 gar nicht starten.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Backups können über die Oberfläche wiederhergestellt werden — großzügig, aber begrenzt
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # Die App ist eine einzige Datei — immer frisch ausliefern, damit Updates sofort ankommen
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
