# Liefert die Oberfläche aus und reicht /api an den API-Container weiter.
# Die Datenbank ist von hier aus nicht erreichbar (eigenes, internes Netz).

# Bremsen gegen Passwort-Raten und Überlastung (je Client-IP)
limit_req_zone $binary_remote_addr zone=sf_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sf_api:10m rate=30r/s;
limit_req_status 429;

# Steht ein Reverse Proxy (z. B. Nginx Proxy Manager) davor, dessen Protokoll-Angabe übernehmen
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # Port 8080 statt 80: der Container läuft ohne Root-Rechte.
    # Nur IPv4: Docker leitet den veröffentlichten Port per IPv4 in den Container, und ein
    # fest eingetragenes "listen [::]" ließe Nginx auf Hosts ohne IPv6 gar nicht starten.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Echte Client-IP: nur von den in TRUSTED_PROXIES eingetragenen Reverse Proxys wird
    # X-Forwarded-For übernommen (Datei erzeugt beim Start /docker-entrypoint.d/05-shopfloor-proxy.sh).
    # Ohne Eintrag gilt die Verbindungsadresse — ein vom Browser mitgeschickter Header zählt nie.
    include /tmp/shopfloor-realip.conf;

    # Wiederherstellung aus einer Sicherungsdatei geht über /api/document — großzügig, aber begrenzt
    client_max_body_size 30m;

    # Sicherheits-Header (gelten für alle Antworten; Locations unten setzen keine eigenen add_header)
    include /etc/nginx/shopfloor-csp.conf;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Wirkt nur, wenn der Browser die Seite per HTTPS geladen hat (über den Reverse Proxy).
    # Bewusst ohne includeSubDomains — andere Subdomains bleiben unberührt.
    add_header Strict-Transport-Security "max-age=15552000" always;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # Die App ist eine einzige Datei — immer frisch ausliefern, damit Updates sofort ankommen
    location = /index.html {
        expires -1;
    }

    # Schrift (lokal statt Google Fonts) — lange zwischenspeichern
    location /fonts/ {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri /index.html;
    }

    # Anmeldung und Registrierung: höchstens 10 Versuche pro Minute je IP (kurze Spitzen erlaubt)
    location ~ ^/api/(login|register|me/password|me/profile|password/forgot|password/reset)$ {
        limit_req zone=sf_login burst=10 nodelay;
        include /etc/nginx/shopfloor-proxy.conf;
    }

    location /api/ {
        limit_req zone=sf_api burst=60 nodelay;
        include /etc/nginx/shopfloor-proxy.conf;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
